name: Creamfields beta CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/delta-creamfields-beta-integration]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
